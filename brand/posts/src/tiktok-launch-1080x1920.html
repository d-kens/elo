<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Hanken+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#0d1330;--bg-2:#131a3d;--fg:#eceef6;--read:#cdd2e3;--muted:#9aa3c4;--line:#283261;--red:#e8402f;
  --d:"Shippori Mincho B1",Georgia,serif;--b:"Hanken Grotesk",system-ui,sans-serif;--m:"IBM Plex Mono",monospace}
html,body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
*{box-sizing:border-box}p,h1{margin:0}
/* TikTok safe zone: clear of the top bar, the caption and the right-hand buttons */
.c{position:relative;overflow:hidden;width:1080px;height:1920px;padding:170px 110px 360px 88px;display:flex;flex-direction:column}
.enso{position:absolute;right:-140px;bottom:-120px;width:560px;opacity:.14}
.top,.body{position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:16px}
.logo b{font:800 44px/1 var(--d)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.k{font:500 24px var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:36px}
h1{font:800 116px/1.02 var(--d);letter-spacing:-.01em}
.facts{display:flex;gap:14px;flex-wrap:wrap;margin-top:72px}
.facts span{font:500 24px var(--m);letter-spacing:.08em;text-transform:uppercase;padding:14px 20px;border:2px solid var(--line);color:var(--muted)}
.url{display:inline-block;margin-top:40px;font:500 34px var(--m);padding:22px 30px;background:var(--red);color:#fff}
</style></head><body><div class="c">
<svg class="enso" viewBox="0 0 520 520"><defs><filter id="r" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter></defs><g filter="url(#r)" fill="none" stroke-linecap="round" stroke="#eceef6"><path stroke-width="30" d="M 292 74 C 410 70 480 190 456 300 C 432 412 308 478 200 444 C 92 410 40 290 92 186 C 130 110 214 66 292 78"/></g></svg>
<div class="top"><div class="logo"><b>elo</b></div></div>
<div class="body">
  <p class="k">Hello, world · Post 01</p>
  <h1>Learn DevOps, one step at a time.</h1>
  <div class="facts"><span>21 modules</span><span>7 phases</span><span>Free</span></div>
  <p><span class="url">d-kens.github.io/elo</span></p>
</div>
</div></body></html>
